[project]
name = "skygenic-scans"
version = "0.1.0"
description = "Graph structure validation for the Skygenic scan layer: real biology seeds, grounded synthetic expansion, Neo4j load, per-scan readiness checks."
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.28",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "numpy>=2.0",
    "networkx>=3.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
