# Dedicated Neo4j for the Skygenic scan-layer structure validation build.
#
# Deliberately NOT on 7474/7687: the machine already has other Neo4j containers
# (`neo4j` 5.15-community, `kg` 2026-community). This stack is isolated so it can
# be torn down and rebuilt without touching them.
#
#   HTTP  http://localhost:7475
#   Bolt  bolt://localhost:7688

services:
  neo4j:
    image: neo4j:2026-community
    container_name: skygenic-scans-neo4j
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: "neo4j/skygenic-scans-dev"

      # APOC + GDS. GDS supplies the centrality / community / pathfinding
      # procedures that PRIM_N01-N05, T02, T08, T11, T20 are specified against.
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'

      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"

      # Sized against the 7.7 GB the Docker VM actually has, NOT against the
      # host. heap 4G + pagecache 2G was over-committed: Neo4j sat at 4.2 GB and
      # the bulk load died with MemoryPoolOutOfMemoryError once the transaction
      # pool hit its 70%-of-heap default (2.8 GiB).
      #
      # 3G heap + 1G pagecache = 4G, leaving ~3.7 GB for GDS off-heap
      # projections (which do NOT come out of heap) and the OS.
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "3G"
      NEO4J_server_memory_pagecache_size: "1G"

      # Explicit rather than the implicit 70%-of-heap default, so the ceiling is
      # visible next to the batch size in graph/loader.py that respects it.
      NEO4J_dbms_memory_transaction_total_max: "2G"

      # No per-transaction cap. A 512M cap was tried and made things worse:
      # DETACH DELETE on a high-degree node has to load all of that node's
      # relationships into one transaction, so a tight per-transaction limit
      # makes deleting a dense graph impossible while doing nothing for the
      # bulk load, which is already batched small in graph/loader.py.
      #
      # To reset this instance, prefer recreating the volume over wiping:
      #   docker compose down -v && docker compose up -d
      # It is faster than DETACH DELETE over a few hundred thousand
      # relationships, and it cannot half-succeed.

      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_server_directories_import: "/import"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ../data/generated:/import

    healthcheck:
      # cypher-shell against bolt is the honest readiness signal; the HTTP port
      # opens before the database is actually able to serve queries.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p skygenic-scans-dev 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

volumes:
  neo4j_data:
  neo4j_logs:
