  to: BiologicalProcess
  doc_table: Protein
  layer: doc_verbatim
  acyclic_required: true
  direction_default: 1
  status: retired
  retired_by: C-02
  superseded_by: TEMPORALLY_PRECEDES
  retirement_rationale: TEMPORALLY_PRECEDES states the semantics SCAN-09 actually tests. Parallel duplicate
    edges also made PRIM_T05's "minimal" Steiner subgraph non-minimal.
- type: RESULTS_IN
  from: BiologicalProcess
  to: Phenotype
  doc_table: Protein
  layer: doc_verbatim
  direction_default: 1
  status: retired
  retired_by: C-03
  superseded_by: PRODUCES_CLINICAL_PHENOTYPE
  retirement_rationale: Three names, one fact. Duplicates also made PRIM_R15's PathScore non-deterministic,
    since which parallel edge a traversal picks is arbitrary.
