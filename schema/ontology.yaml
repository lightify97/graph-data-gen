  status: retired
  retired_by: C-06
  superseded_by: CONSTITUTES_PATHWAY
  retirement_rationale: Duplicate membership edges inflated SCAN-13's Pathway Coverage without adding
    a single real member. PART_OF is also generic enough to invite reuse.
