relationships:
- type: ACTIVATES
  from: Protein
  to: BiologicalProcess
  doc_table: Protein
  layer: doc_verbatim
  purpose: Establishes the specific biological direction of an interaction.
  criteria: SCAN-01 ingestion threshold; SCAN-03 assigns positive directional score.
  direction_default: 1
  status: active
- type: INHIBITS
  from: Protein
  to: BiologicalProcess
  doc_table: Protein
  layer: doc_verbatim
  purpose: Establishes the specific inhibitory direction of an interaction.
  direction_default: -1
  status: active
- type: ACTIVATED_BY
  from: BiologicalProcess
  to: Drug
  doc_table: Protein
  layer: doc_verbatim
  purpose: Determines the biological direction of a pharmacological intervention.
  direction_default: 1
  status: retired
  retired_by: C-07
  superseded_by: PHARMACOLOGICALLY_ACTIVATES
  retirement_rationale: 'The most functionally severe conflict. As documented the arrow ran BiologicalProcess
    -> Drug, making the Drug a SINK: a directed walk starting at a Drug could never reach the process
    it modulates, so SCAN-07, SCAN-29 and the whole exposure->outcome family returned empty or truncated
    paths without erroring. Re-pointed to the causal direction and renamed onto the Drug table''s existing
    PHARMACOLOGICALLY_* convention, which already ran Drug -> Protein correctly. If the passive phrasing
    is wanted for narration, derive it at render time; do not store it as topology.'
- type: SUPPRESSED_BY
  from: BiologicalProcess
  to: Drug
  doc_table: Protein
  layer: doc_verbatim
  direction_default: -1
  status: retired
  retired_by: C-07
  superseded_by: PHARMACOLOGICALLY_INHIBITS
  retirement_rationale: 'The most functionally severe conflict. As documented the arrow ran BiologicalProcess
    -> Drug, making the Drug a SINK: a directed walk starting at a Drug could never reach the process
    it modulates, so SCAN-07, SCAN-29 and the whole exposure->outcome family returned empty or truncated
    paths without erroring. Re-pointed to the causal direction and renamed onto the Drug table''s existing
    PHARMACOLOGICALLY_* convention, which already ran Drug -> Protein correctly. If the passive phrasing
    is wanted for narration, derive it at render time; do not store it as topology.'
- type: CAUSES
  from: BiologicalProcess
  to: Disease
  doc_table: Protein
  layer: doc_verbatim
  direction_default: 1
  status: retired
  retired_by: C-01
  superseded_by: DRIVES_DISEASE_PATHOLOGY
  retirement_rationale: Three names for one assertion. The revised Biological-process table is the later
    authoring pass and its name is unambiguous. Retiring CAUSES here does NOT touch CAUSES on its three
    other endpoint pairs (see C-11).
- type: ASSOCIATED_WITH
  from: BiologicalProcess
  to: Disease
  doc_table: Protein
  layer: doc_verbatim
  direction_default: 0
  status: active
- type: INVOLVES
  from: BiologicalProcess
  to: Variant
  doc_table: Protein
  layer: doc_verbatim
  direction_default: 0
  status: retired
  retired_by: C-08
  superseded_by: mQTL_MODULATES
  retirement_rationale: Stored in both directions, creating a 2-cycle on every linked pair. PRIM_T07 would
    report each as a feedback loop and classify it by net sign — a fabricated regulatory motif. Keep the
    causal direction (variant modulates process), matching the eQTL/pQTL pair.
- type: PRECEDES
