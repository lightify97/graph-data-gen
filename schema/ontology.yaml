constraints:
  unique_keys: auto
  extra_indexes:
  - label: Gene
    property: symbol
  - label: Disease
    property: biological_domain
  - label: Protein
    property: gene_symbol
  - label: Evidence
    property: modality
  - label: Publication
    property: publication_year
  - label: Publication
    property: source_type
  - label: Variant
    property: chromosome
  - label: SkygenicHypothesis
    property: biological_domain
  no_self_loops:
    enforced: true
    rule: NOT (n)-[r]->(n)
    source: C-20 — Part 1 SII.1, reading 1 (true self-loops only)
  predicate_importance_key:
    rule: (predicate, from_label, to_label)
    source: C-11 — PRIM_P09 keyed on predicate alone is ambiguous
