- type: ENCODES
  from: Gene
  to: Protein
  layer: extension
  gap_ref: G-01
  forced_by: No Gene->Protein edge exists anywhere in the Nodes doc. Without it the variant->gene->protein->disease
    chain is severed, SCAN-24 (Target Prioritization, scope Protein) cannot reach gene-level evidence,
    and SCAN-18's pQTL/eQTL results cannot be reconciled.
  direction_default: 1
  status: active
- type: PROTEIN_INTERACTS_WITH
  from: Protein
  to: Protein
  layer: extension
  gap_ref: G-02
  forced_by: Part 1 names STRING as the source for protein-protein interaction (INTERACTS_WITH / PREDICTED_TO_INTERACT_WITH
    over Protein), but Part 2's per-node tables only define these Gene->Gene. Named distinctly to avoid
    silently overloading the Gene-scoped type.
  symmetric: true
  direction_default: 0
  status: active
- type: PROTEIN_PARTICIPATES_IN
  from: Protein
  to: Pathway
  layer: extension
  gap_ref: G-03
  forced_by: Part 1 maps Reactome to Protein/ProteinComplex -> Pathway via PARTICIPATES_IN / CONSTITUTES_PATHWAY,
    but Part 2 defines PARTICIPATES_IN only as Gene->Pathway.
  direction_default: 0
  status: active
- type: MAPS_TO_LOCUS
  from: Variant
  to: Gene
  layer: extension
  gap_ref: G-04
  forced_by: 'PRIM_G01 verbatim: ''This node must connect to standard Gene nodes via a localized maps_to_locus
    edge type.'''
  direction_default: 0
  status: active
- type: EVIDENCED_BY_ASSERTION
  from: Evidence
  to: Assertion
  layer: extension
  gap_ref: G-05
  forced_by: PRIM_E15 get_edge_provenance returns assertion_ids; PRIM_S17 promote_assertion_to_edge requires
    the assertion->edge lineage.
  direction_default: 0
  status: active
- type: DERIVED_FROM_DATASET
  from: Assertion
  to: Dataset
  layer: extension
  gap_ref: G-05
  forced_by: PRIM_E13 get_edges_by_dataset, PRIM_T17 get_affected_subgraph_for_dataset (2-hop recompute
    trigger).
  direction_default: 0
  status: active
- type: MEASURED_IN_COHORT
  from: Dataset
  to: Cohort
  layer: extension
  gap_ref: G-06
  forced_by: PRIM_N10 compute_cohort_separation_for_node needs disease vs control cohort partitions reachable
    from the evidence.
  direction_default: 0
  status: active
- type: OBSERVED_IN_CELL_TYPE
  from: Evidence
  to: CellType
  layer: extension
  gap_ref: G-07
  forced_by: source_registry CELL_TYPE entity type; ONC_05 compute_TME_score, IMM_01 compute_immune_infiltration.
  direction_default: 0
  status: active
- type: HAS_VERSION
  from: SkygenicHypothesis
  to: HypothesisVersion
  layer: extension
  gap_ref: G-08
  forced_by: SUPERSEDES_VERSION alone gives no ordered history. PRIM_R08 compute_stability_score needs
    the last min(5, N-1) entries and PRIM_S09 write_evaluation_history_entry is append-only.
  direction_default: 1
  status: active
- type: SCOPED_TO_STATE
  from: SkygenicHypothesis
  to: BiologicalState
  layer: extension
  gap_ref: G-09
  forced_by: PRIM_S21 link_hypothesis_to_state — 'Associates with BiologicalState. Triggers initial MC
    via S06.'
  direction_default: 0
  status: active
- type: HYPOTHESIS_INCLUDES_NODE
  from: SkygenicHypothesis
  to: Gene
  layer: extension
  gap_ref: G-10
  forced_by: PRIM_T09 extract_hypothesis_subgraph needs target_nodes and outcome_nodes membership. Part
    1 removed the generic hub-and-spoke hypothesis edges but left no typed replacement for subgraph scoping.
  properties:
    role:
      type: string
      enum:
      - target
      - outcome
      - expected_edge_endpoint
      - context
  direction_default: 0
  also_to:
  - Protein
  - Pathway
  - Disease
  - Variant
  - BiologicalProcess
  - Drug
  - Phenotype
  status: active
- type: SCAN_RESULT_FOR
  from: ScanResult
