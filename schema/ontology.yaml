  retirement_rationale: Two synonyms plus an inverse. Both landed in PRIM_E16's denominator, so SCAN-08's
    Context-Universal vs Context-Dependent call was computed against an inflated edge count.
- type: SUPPORTED_BY
  from: BiologicalProcess
  to: Publication
  doc_table: Protein
  layer: doc_verbatim
  direction_default: 0
  status: retired
  retired_by: C-10
  superseded_by: EVIDENCED_BY
  retirement_rationale: Five names for one relationship, and a sixth needed for every new node type. SCAN-11
    has to union all of them to award "Fully Traceable (Audit-Ready)", and a missed name does not error
    — it silently downgrades a fully-traceable claim. For a regulatory control, a silent false negative
    is the worst available failure mode. The source label already carries the discriminating information
    the separate names encoded. Also extends provenance to Protein, Variant and Pathway, which had none.
