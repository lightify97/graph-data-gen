node_property_contract:
  uid:
    type: string
    required: true
    desc: Global unique key, namespaced '<Label>:<canonical_id>'. Neo4j uniqueness constraint.
    example: Gene:HGNC:11998
  canonical_id:
    type: string
    required: true
    desc: PRIM_N08. Authoritative accession in its home namespace, no prefix.
    example: HGNC:11998
  entity_type:
    type: string
    required: true
    desc: PRIM_N08 / PRIM_N07 compute_node_class. Denormalised label so class branching never needs a
      label lookup.
  synonyms:
    type: list[string]
    required: true
    default: []
    desc: PRIM_N08. Empty list is valid; null is not. Feeds PRIM_V13 / PRIM_H01 entity resolution.
  ontology_refs:
    type: list[string]
    required: true
    default: []
    desc: PRIM_N08. Cross-ontology xrefs, prefixed CURIEs.
  species:
    type: int
    required: false
    desc: PRIM_N08. NCBI taxon id. Null only for species-agnostic labels (OntologyTerm, Publication, Dataset,
      ScanResult, AuditEvent).
  source:
    type: string
    required: true
    desc: Primary source_id from source_registry.yaml that this record was built from. For generated records,
      the source of the SEED it was derived from.
    enum_ref: source_registry.yaml entity_types[*].{primary,supplementary}[*].source_id
    example: hgnc
  source_priority:
    type: int
    required: true
    enum:
    - 1
    - 2
    desc: 1 = primary source, 2 = supplementary. Mirrors source_registry priority.
  source_ids:
    type: list[string]
    required: true
    default: []
    desc: Every source_id that contributed a field to this record, in merge order.
  source_url:
    type: string
    required: false
    desc: Exact retrieval URL for the seed record. Null for purely generated nodes.
  source_retrieved_at:
    type: datetime
    required: false
    desc: When the upstream source was actually called. Null for generated nodes.
  is_synthetic:
    type: boolean
    required: true
    desc: 'TRUE if this record was generated rather than fetched from a live API. Non-negotiable: the
      whole point of this build is that a reader can tell real seed data from generated data without guessing.'
  synthesis_method:
    type: string
    required: false
    enum:
    - seed_fetched
    - seed_derived
    - degree_preserving_expansion
    - ontology_walk
    - statistical_sample
    - template_instantiated
    desc: How a synthetic record came to exist. Null iff is_synthetic = false.
  synthesis_seed_uid:
    type: string
    required: false
    desc: uid of the real fetched node this record was derived from, when is_synthetic = true and it descends
      from a real seed.
  created_at:
    type: datetime
    required: true
    desc: PRIM_N08. Immutable. Set once at first write, never rewritten.
  updated_at:
    type: datetime
    required: true
    desc: Bumped on every property mutation. Equals created_at on first write.
  ingested_at:
    type: datetime
    required: true
    desc: When this record entered THIS graph, as distinct from created_at on the upstream record.
  valid_from:
    type: datetime
    required: true
    desc: Temporal-service anchor. Start of this record's validity window.
  valid_to:
    type: datetime
    required: false
    desc: End of validity window. Null = currently valid. Reserved for the temporal scan service; never
      set during the initial load.
  Dv_created:
    type: int
    required: true
    desc: PRIM_S01 monotonic Data Version at insert.
  Tv_created:
    type: int
    required: true
    desc: PRIM_S02 Topology Version at insert.
  record_hash:
    type: string
    required: true
    desc: SHA256 over the sorted type-specific property set. Change detection and idempotent re-load.
      Excludes updated_at so it is stable across no-op writes.
  schema_version:
    type: int
    required: true
    desc: meta.version this record conforms to. Enables mixed-version migration.
  layer:
    type: string
    required: true
    enum:
    - doc_verbatim
    - extension
    desc: Which schema layer this node's label belongs to. Denormalised so a query can exclude extension-layer
      nodes without a label join.
nodes:
