# =============================================================================
# Conflict resolutions — schema v1 (doc-verbatim) -> v2 (canonical)
# =============================================================================
# One entry per conflict in docs/schema-gap-analysis.md. This file is the
# reviewable record of what changed and why; schema/ontology-v2.yaml is
# GENERATED from it by `python -m skygenic_scans.schema_migrate`.
#
# IMPORTANT: retirement is keyed on the (type, from, to) TRIPLE, never on the
# type name alone. CAUSES is the reason — C-01 retires CAUSES(BiologicalProcess
# -> Disease) as a duplicate of DRIVES_DISEASE_PATHOLOGY, while C-11 deliberately
# KEEPS CAUSES on Gene->Disease, Compound->Phenotype and ProteinComplex->Disease.
# Retiring by name would silently delete three legitimate relationships.
#
# kinds:
#   synonym_merge  several names, one endpoint pair -> keep one, retire the rest
#   inverse_merge  A->B and B->A both stored -> keep the causal direction only
#   collapse       many names across many source labels -> one general type
#   redirect       endpoint order is wrong -> re-point (and rename to match)
#   no_change      conflict is real but the fix is config, not schema
#   clarification  ambiguous wording -> state the intended reading explicitly
# =============================================================================

meta:
  from_version: 1
  to_version: 2
  generated_by: "skygenic_scans.schema_migrate"
  policy: >
    Where two names describe one fact, keep the one whose name states the
    semantics a scan branches on. Where a pair is stored in both directions,
    keep the causal direction (cause -> effect) and let Neo4j traverse the
    inverse at query time, which costs nothing.

resolutions:

  # --- synonym merges -------------------------------------------------------
  - conflict: C-01
    kind: synonym_merge
    keep: {type: DRIVES_DISEASE_PATHOLOGY, from: BiologicalProcess, to: Disease}
    retire:
      - {type: CAUSES, from: BiologicalProcess, to: Disease}
      - {type: DRIVES_PATHOLOGY, from: BiologicalProcess, to: Disease}
    rationale: >
      Three names for one assertion. The revised Biological-process table is the
      later authoring pass and its name is unambiguous. Retiring CAUSES here does
      NOT touch CAUSES on its three other endpoint pairs (see C-11).

  - conflict: C-02
    kind: synonym_merge
    keep: {type: TEMPORALLY_PRECEDES, from: BiologicalProcess, to: BiologicalProcess}
    retire:
      - {type: PRECEDES, from: BiologicalProcess, to: BiologicalProcess}
    rationale: >
      TEMPORALLY_PRECEDES states the semantics SCAN-09 actually tests. Parallel
      duplicate edges also made PRIM_T05's "minimal" Steiner subgraph non-minimal.

  - conflict: C-03
    kind: synonym_merge
    keep: {type: PRODUCES_CLINICAL_PHENOTYPE, from: BiologicalProcess, to: Phenotype}
    retire:
      - {type: RESULTS_IN, from: BiologicalProcess, to: Phenotype}
      - {type: PRODUCES_OUTCOME, from: BiologicalProcess, to: Phenotype}
    rationale: >
      Three names, one fact. Duplicates also made PRIM_R15's PathScore
      non-deterministic, since which parallel edge a traversal picks is arbitrary.

  - conflict: C-04
    kind: synonym_merge
    keep: {type: CONSERVED_IN, from: BiologicalProcess, to: Species}
    retire:
      - {type: EVOLUTIONARILY_CONSERVED_IN, from: BiologicalProcess, to: Species}
    rationale: >
      Asymmetric duplication: BiologicalProcess carried both names while Gene,
      Tissue and ProteinComplex carried only CONSERVED_IN. Keeping CONSERVED_IN
      makes SCAN-16 comparable across node types, which is its whole purpose.

  - conflict: C-05
    kind: synonym_merge
    keep: {type: BIOMARKER_FOR, from: BiologicalProcess, to: Disease}
    retire:
      - {type: SERVES_AS_BIOMARKER_FOR, from: BiologicalProcess, to: Disease}
    rationale: >
      BIOMARKER_FOR is already the uniform name on Gene->Disease and
      ProteinComplex->Phenotype. The duplicate skewed PRIM_R10's mean_ES for
      BiologicalProcess only.

  - conflict: C-06
    kind: synonym_merge
    keep: {type: CONSTITUTES_PATHWAY, from: BiologicalProcess, to: Pathway}
    retire:
      - {type: PART_OF, from: BiologicalProcess, to: Pathway}
    rationale: >
      Duplicate membership edges inflated SCAN-13's Pathway Coverage without
      adding a single real member. PART_OF is also generic enough to invite reuse.

  - conflict: C-12
    kind: synonym_merge
    keep: {type: STANDARDIZED_BY_ONTOLOGY, from: Disease, to: OntologyTerm}
    retire:
      - {type: STANDARDIZES_DISEASE, from: Disease, to: OntologyTerm}
    rationale: >
      STANDARDIZED_BY_ONTOLOGY is already the general form and is used for
      BiologicalProcess->OntologyTerm.

  - conflict: C-17
    kind: synonym_merge
    keep: {type: MR_VALIDATES_RISK_FOR, from: Variant, to: Disease}
    retire:
      - {type: CAUSALLY_DRIVES, from: Variant, to: Disease}
    rationale: >
      Both justified by the same Mendelian-randomisation criterion.
      MR_VALIDATES_RISK_FOR names the evidence class, which is what SCAN-09
      branches on, and avoids implying proven causality.

  - conflict: C-18
    kind: synonym_merge
    keep: {type: AMELIORATES_TRAIT, from: Drug, to: Phenotype}
    retire:
      - {type: AMELIORATES, from: Drug, to: Phenotype}
    rationale: Pure synonym. AMELIORATES_TRAIT matches the Drug table's naming.

  - conflict: C-19
    kind: synonym_merge
    keep: {type: CLINICALLY_TREATS, from: Drug, to: Disease}
    retire:
      - {type: TREATS_INDICATION, from: Drug, to: Disease}
    rationale: >
      The primary therapeutic edge and the terminus of SCAN-07's exposure->outcome
      DAG, so duplication here hit the highest-value path in the product.
      CLINICALLY_TREATS is the name SCAN-29's criterion cites.

  # --- inverse merges -------------------------------------------------------
  - conflict: C-08
    kind: inverse_merge
    keep: {type: mQTL_MODULATES, from: Variant, to: BiologicalProcess}
    retire:
      - {type: INVOLVES, from: BiologicalProcess, to: Variant}
    rationale: >
      Stored in both directions, creating a 2-cycle on every linked pair.
      PRIM_T07 would report each as a feedback loop and classify it by net sign —
      a fabricated regulatory motif. Keep the causal direction (variant modulates
      process), matching the eQTL/pQTL pair.

  - conflict: C-13
    kind: inverse_merge
    keep: {type: eQTL_MODULATES, from: Variant, to: Gene}
    retire:
      - {type: REGULATED_BY_QTL, from: Gene, to: Variant}
    rationale: >
      2-cycle on every eQTL. eQTL_MODULATES runs in the causal direction and is
      consistent with pQTL_MODULATES / mQTL_MODULATES.

  - conflict: C-14
    kind: inverse_merge
    keep: {type: EXPRESSED_IN, from: Gene, to: Tissue}
    retire:
      - {type: EXPRESSES, from: Tissue, to: Gene}
    rationale: >
      The single largest contributor to degree inflation, because Tissue is a
      very high-degree hub (mean degree 534). Directly distorted SCAN-02's
      network-role matrix. Neo4j traverses relationships in either direction at
      no cost, so the inverse reading needs no stored edge.

  - conflict: C-15
    kind: inverse_merge
    keep: {type: LOCALIZES_PATHOLOGY_IN, from: Disease, to: Tissue}
    retire:
      - {type: EXHIBITS_PATHOLOGY_OF, from: Tissue, to: Disease}
    rationale: Inverse pair. Disease->Tissue reads as the localisation assertion.

  - conflict: C-16
    kind: inverse_merge
    keep: {type: DISTRIBUTED_IN_CONTEXT, from: Drug, to: Tissue}
    retire:
      - {type: ACCUMULATES, from: Tissue, to: Drug}
    rationale: >
      Inverse pair that doubled every drug's tissue footprint. SCAN-28's
      Aggregate Off-Target Risk is monotonic in that footprint, so this inflated
      a SAFETY number.

  - conflict: C-09
    kind: inverse_merge
    keep: {type: OPERATES_WITHIN_CONTEXT, from: BiologicalProcess, to: Tissue}
    retire:
      - {type: OCCURS_IN, from: BiologicalProcess, to: Tissue}
      - {type: OCCURS_IN, from: ProteinComplex, to: Tissue}
      - {type: CONTEXTUALIZES, from: Tissue, to: BiologicalProcess}
    add:
      # ProteinComplex loses its only Tissue edge when OCCURS_IN retires, so
      # OPERATES_WITHIN_CONTEXT must be extended to cover it.
      - {type: OPERATES_WITHIN_CONTEXT, from: ProteinComplex, to: Tissue,
         direction_default: 0,
         purpose: "Anatomical context for a protein complex (replaces OCCURS_IN)."}
    rationale: >
      Two synonyms plus an inverse. Both landed in PRIM_E16's denominator, so
      SCAN-08's Context-Universal vs Context-Dependent call was computed against
      an inflated edge count.

  # --- collapse -------------------------------------------------------------
  - conflict: C-10
    kind: collapse
    new_type: EVIDENCED_BY
    retire:
      - {type: SUPPORTED_BY, from: BiologicalProcess, to: Publication}
      - {type: SUPPORTED_BY, from: Gene, to: Publication}
      - {type: SUPPORTED_BY, from: ProteinComplex, to: Publication}
      - {type: SUPPORTED_BY, from: Tissue, to: Publication}
      - {type: PROCESS_EVIDENCED_BY, from: BiologicalProcess, to: Publication}
      - {type: DISEASE_EVIDENCED_BY, from: Disease, to: Publication}
      - {type: DRUG_EVIDENCED_BY, from: Drug, to: Publication}
      - {type: PHENOTYPICALLY_SUPPORTED_BY, from: Phenotype, to: Publication}
      - {type: SUPPORTED_BY_PROVENANCE, from: SkygenicHypothesis, to: Publication}
    add:
      - {type: EVIDENCED_BY, from: Gene, to: Publication, direction_default: 0}
      - {type: EVIDENCED_BY, from: Protein, to: Publication, direction_default: 0}
      - {type: EVIDENCED_BY, from: BiologicalProcess, to: Publication, direction_default: 0}
      - {type: EVIDENCED_BY, from: ProteinComplex, to: Publication, direction_default: 0}
      - {type: EVIDENCED_BY, from: Tissue, to: Publication, direction_default: 0}
      - {type: EVIDENCED_BY, from: Disease, to: Publication, direction_default: 0}
      - {type: EVIDENCED_BY, from: Drug, to: Publication, direction_default: 0}
      - {type: EVIDENCED_BY, from: Phenotype, to: Publication, direction_default: 0}
      - {type: EVIDENCED_BY, from: Variant, to: Publication, direction_default: 0}
      - {type: EVIDENCED_BY, from: Pathway, to: Publication, direction_default: 0}
      - {type: EVIDENCED_BY, from: SkygenicHypothesis, to: Publication, direction_default: 0}
    rationale: >
      Five names for one relationship, and a sixth needed for every new node
      type. SCAN-11 has to union all of them to award "Fully Traceable
      (Audit-Ready)", and a missed name does not error — it silently downgrades a
      fully-traceable claim. For a regulatory control, a silent false negative is
      the worst available failure mode. The source label already carries the
      discriminating information the separate names encoded.
      Also extends provenance to Protein, Variant and Pathway, which had none.

  # --- redirect -------------------------------------------------------------
  - conflict: C-07
    kind: redirect
    retire:
      # Explicit per-row mapping: a redirect has more than one replacement and
      # they are not interchangeable — activation and suppression must not be
      # collapsed onto the same successor.
      - {type: ACTIVATED_BY, from: BiologicalProcess, to: Drug,
         superseded_by: PHARMACOLOGICALLY_ACTIVATES}
      - {type: SUPPRESSED_BY, from: BiologicalProcess, to: Drug,
         superseded_by: PHARMACOLOGICALLY_INHIBITS}
    add:
      - {type: PHARMACOLOGICALLY_ACTIVATES, from: Drug, to: BiologicalProcess,
         direction_default: 1,
         purpose: "Drug positively modulates a biological process."}
      - {type: PHARMACOLOGICALLY_INHIBITS, from: Drug, to: BiologicalProcess,
         direction_default: -1,
         purpose: "Drug negatively modulates a biological process."}
    rationale: >
      The most functionally severe conflict. As documented the arrow ran
      BiologicalProcess -> Drug, making the Drug a SINK: a directed walk starting
      at a Drug could never reach the process it modulates, so SCAN-07, SCAN-29
      and the whole exposure->outcome family returned empty or truncated paths
      without erroring. Re-pointed to the causal direction and renamed onto the
      Drug table's existing PHARMACOLOGICALLY_* convention, which already ran
      Drug -> Protein correctly. If the passive phrasing is wanted for narration,
      derive it at render time; do not store it as topology.

  # --- no schema change -----------------------------------------------------
  - conflict: C-11
    kind: no_change
    affected:
      - {type: ACTIVATES, from: Compound, to: Protein}
      - {type: ACTIVATES, from: ProteinComplex, to: BiologicalProcess}
      - {type: INHIBITS, from: Compound, to: Protein}
      - {type: INHIBITS, from: ProteinComplex, to: Pathway}
      - {type: CAUSES, from: Gene, to: Disease}
      - {type: CAUSES, from: Compound, to: Phenotype}
      - {type: CAUSES, from: ProteinComplex, to: Disease}
      - {type: PREDICTED_TO_INTERACT_WITH, from: ProteinComplex, to: ProteinComplex}
    action: config
    rationale: >
      Type reuse across endpoint pairs is legal and idiomatic in Neo4j, and these
      are genuinely distinct relationships that happen to share a verb. KEEP THEM.
      The only real problem is PRIM_P09 load_predicate_importance_table, which is
      keyed on predicate alone, so one weight for CAUSES must serve both "a
      biological process causes a disease" and "a compound causes a phenotype".
      That weight feeds compute_gap_importance at 20%.
      FIX: key the table on (predicate, from_label, to_label). Config change, not
      a schema change — recorded here so it is not lost.

  # --- clarification --------------------------------------------------------
  - conflict: C-20
    kind: clarification
    action: constraint
    constraint: no_self_loops
    rationale: >
      Part 1 SII.1 "Remove: Gene -> Gene, Protein -> Protein, ..." is ambiguous.
      Reading 1 (adopted): remove true self-loops, (n)-[r]->(n). Reading 2 would
      delete UPREGULATES, DOWNREGULATES, INTERACTS_WITH, PREDICTED_TO_INTERACT_WITH,
      ORTHOLOG_OF, TEMPORALLY_PRECEDES, MECHANISTICALLY_SIMILAR_TO,
      ONTOLOGICALLY_INCLUDES and SEMANTICALLY_OVERLAPS_WITH — all of which Part 2
      explicitly defines and SCAN-12/14/25 depend on. The doc's own justification
      ("a compound does not therapeutically interact with itself") supports only
      reading 1. v2 states it as an explicit schema constraint.
